<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รถรับส่งพนักงาน – รายชื่อตามจุดขึ้น</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e5ea;--pr:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--hl:#fff7e0;--dg:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--tx:#eef0f4;--mu:#9aa1ad;--bd:#2c313a;--pr:#60a5fa;--ok:#4ade80;--okbg:#14301f;--hl:#2e2812;--dg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--tx:#eef0f4;--mu:#9aa1ad;--bd:#2c313a;--pr:#60a5fa;--ok:#4ade80;--okbg:#14301f;--hl:#2e2812;--dg:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Noto Sans Thai","Sarabun",system-ui,sans-serif;max-width:640px;margin-inline:auto;padding:0 12px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 8px;z-index:5}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;white-space:nowrap}
.tab.on{background:var(--pr);border-color:var(--pr);color:#fff}
.sum{margin:10px 0 0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.stop{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:12px 0;overflow:hidden}
.stop.next{border:2px solid var(--pr)}
.sh{display:flex;gap:10px;align-items:center;padding:12px;background:var(--hl)}
.stop:not(.next) .sh{background:transparent}
.time{font-weight:700;color:var(--pr);min-width:52px}
.sn{flex:1;font-weight:600}
.cnt{font-size:13px;color:var(--mu);white-space:nowrap}
.tag{font-size:12px;background:var(--pr);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.p{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--tx);font:inherit;text-align:left}
.p .ck{width:28px;height:28px;border:2px solid var(--mu);border-radius:8px;display:grid;place-items:center;flex:none;font-size:18px;color:#fff}
.p.on{background:var(--okbg)}
.p.on .ck{background:var(--ok);border-color:var(--ok)}
.p.on .nm{text-decoration:line-through;color:var(--mu)}
.nm{flex:1}.dp{font-size:13px;color:var(--mu)}
.empty{padding:12px;color:var(--mu);font-size:14px;border-top:1px solid var(--bd)}
.row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
input{flex:1;min-width:90px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.b{padding:10px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;font-weight:600}
button.g{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
button.x{border:0;background:none;color:var(--dg);font-size:20px;padding:4px 8px}
.tools{display:flex;gap:8px;margin-top:8px}
.ov{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:12px;padding:4px 12px}
.ov summary{font-weight:700;padding:10px 0;cursor:pointer}
.ov ol{margin:0 0 10px;padding:0;list-style:none}
.ov li{padding:8px 0;border-top:1px solid var(--bd)}
.ov li b{color:var(--pr)}
.ov .ns{display:inline-block;margin:3px 6px 0 0;padding:2px 8px;border-radius:12px;background:var(--bg);font-size:14px}
.ov .ns.dn{background:var(--okbg);color:var(--mu);text-decoration:line-through}
</style>
</head>
<body>
<header>
  <h1><span>🚐 รถรับส่งพนักงาน</span><span class="tools"><button class="g" id="edit"></button></span></h1>
  <div class="tabs" id="tabs"></div>
  <div class="sum" id="sum"></div>
</header>
<main id="main"></main>
<div class="tools" style="margin-top:16px"><button class="g" id="reset">เริ่มรอบใหม่ (ล้างเครื่องหมาย)</button></div>

<script>
var KEY="shuttle_v1",uid=function(){return Math.random().toString(36).slice(2,9)};
var sample=function(){return{cur:0,trips:[
{id:uid(),name:"รอบเช้า",stops:[
{id:uid(),name:"BTS อ่อนนุช",time:"06:30",pax:[{id:uid(),name:"สมชาย ใจดี",dept:"บัญชี"},{id:uid(),name:"วิภา รักงาน",dept:"HR"}]},
{id:uid(),name:"เซเว่น ซอยสุขุมวิท 71",time:"06:50",pax:[{id:uid(),name:"ประยุทธ์ มั่นคง",dept:"ผลิต"},{id:uid(),name:"นภา สดใส",dept:"QC"},{id:uid(),name:"ธนา แสงทอง",dept:"คลังสินค้า"}]},
{id:uid(),name:"ตลาดบางนา",time:"07:10",pax:[{id:uid(),name:"มาลี ศรีสุข",dept:"ผลิต"}]}]},
{id:uid(),name:"รอบเย็น",stops:[
{id:uid(),name:"หน้าโรงงาน (ต้นทาง)",time:"17:30",pax:[]}]}]}};
var S,edit=false,done={};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
try{done=JSON.parse(localStorage.getItem(KEY+"d"))||{}}catch(e){}
if(!S||!S.trips)S=sample();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+"d",JSON.stringify(done))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}

function render(){
  var t=S.trips[S.cur]||S.trips[0],all=0,on=0,nextId=null;
  $("edit").textContent=edit?"✔ เสร็จ":"✎ แก้ไข";
  $("tabs").innerHTML=S.trips.map(function(x,i){return '<button class="tab'+(i==S.cur?' on':'')+'" data-tab="'+i+'">'+esc(x.name)+'</button>'}).join("")+(edit?'<button class="tab" data-addtrip="1">+ รอบ</button>':'');
  t.stops.forEach(function(s){s.pax.forEach(function(p){all++;if(done[p.id])on++});
    if(!nextId&&s.pax.some(function(p){return!done[p.id]}))nextId=s.id});
  $("sum").innerHTML='<b>ขึ้นรถแล้ว '+on+' / '+all+' คน</b> <span class="cnt">เหลือ '+(all-on)+'</span><div class="bar"><i style="width:'+(all?on/all*100:0)+'%"></i></div>';
  var h=t.stops.map(function(s){
    var n=s.pax.filter(function(p){return done[p.id]}).length,isNext=s.id===nextId;
    var ps=s.pax.length?s.pax.map(function(p){
      return '<div style="display:flex;align-items:center"><button class="p'+(done[p.id]?' on':'')+'" data-p="'+p.id+'"><span class="ck">'+(done[p.id]?'✓':'')+'</span><span class="nm">'+esc(p.name)+(p.dept?'<div class="dp">'+esc(p.dept)+'</div>':'')+'</span></button>'+(edit?'<button class="x" data-dp="'+s.id+'|'+p.id+'">×</button>':'')+'</div>'}).join(""):'<div class="empty">ไม่มีคนขึ้นจุดนี้</div>';
    var add=edit?'<div class="row"><input placeholder="ชื่อพนักงาน" id="n'+s.id+'"><input placeholder="แผนก" id="d'+s.id+'"><button class="b" data-ap="'+s.id+'">+ เพิ่มคน</button></div>':'';
    return '<section class="stop'+(isNext?' next':'')+'"><div class="sh"><span class="time">'+esc(s.time||'--:--')+'</span><span class="sn">'+esc(s.name)+(isNext?'<span class="tag">จุดถัดไป</span>':'')+'</span><span class="cnt">'+n+'/'+s.pax.length+' คน</span>'+(edit?'<button class="x" data-ds="'+s.id+'">🗑</button>':'')+'</div>'+ps+add+'</section>'}).join("");
  if(edit)h+='<section class="stop"><div class="row"><input type="time" id="st" value="07:00" style="max-width:120px"><input placeholder="ชื่อจุดขึ้นรถ" id="sn"><button class="b" data-as="1">+ เพิ่มจุด</button></div></section>'+(S.trips.length>1?'<button class="g" data-dt="1" style="color:var(--dg)">ลบรอบนี้</button>':'');
  if(!t.stops.length&&!edit)h='<div class="empty">ยังไม่มีจุดขึ้นรถ กด “แก้ไข” เพื่อเพิ่ม</div>';
  var ov='<details class="ov" open><summary>📋 สรุปรายชื่อตามจุดรับ</summary><ol>'+t.stops.map(function(s,i){
    return '<li><b>'+(i+1)+'. '+esc(s.time||'--:--')+' · '+esc(s.name)+'</b> <span class="cnt">('+s.pax.length+' คน)</span><div>'+(s.pax.length?s.pax.map(function(p){return '<span class="ns'+(done[p.id]?' dn':'')+'">'+esc(p.name)+'</span>'}).join(''):'<span class="cnt">ไม่มีคนขึ้น</span>')+'</div></li>'}).join('')+'</ol></details>';
  $("main").innerHTML=(t.stops.length?ov:'')+h;
}

document.addEventListener("click",function(e){
  var el=e.target.closest("button");if(!el)return;
  var t=S.trips[S.cur],d=el.dataset;
  if(el.id==="edit"){edit=!edit}
  else if(el.id==="reset"){if(confirm("ล้างเครื่องหมาย 'ขึ้นรถแล้ว' ทั้งหมด?"))done={}}
  else if(d.tab!==undefined){S.cur=+d.tab}
  else if(d.addtrip){var nm=prompt("ชื่อรอบ (เช่น รอบกลางคืน)");if(nm){S.trips.push({id:uid(),name:nm,stops:[]});S.cur=S.trips.length-1}}
  else if(d.dt){if(confirm("ลบรอบ "+t.name+"?")){S.trips.splice(S.cur,1);S.cur=0}}
  else if(d.p){done[d.p]?delete done[d.p]:done[d.p]=1}
  else if(d.ap){var s=t.stops.filter(function(x){return x.id===d.ap})[0],n=$("n"+d.ap).value.trim();if(!n)return;s.pax.push({id:uid(),name:n,dept:$("d"+d.ap).value.trim()})}
  else if(d.dp){var a=d.dp.split("|"),st=t.stops.filter(function(x){return x.id===a[0]})[0];st.pax=st.pax.filter(function(p){return p.id!==a[1]})}
  else if(d.ds){if(confirm("ลบจุดนี้?"))t.stops=t.stops.filter(function(x){return x.id!==d.ds})}
  else if(d.as){var nn=$("sn").value.trim();if(!nn)return;t.stops.push({id:uid(),name:nn,time:$("st").value,pax:[]});t.stops.sort(function(a,b){return(a.time||"").localeCompare(b.time||"")})}
  else return;
  save();render();
});
render();
</script>
</body>
</html>
